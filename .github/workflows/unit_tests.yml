name: Unit tests

on:
  push:
    branches:
      - main
      - master
    paths:
      - '.github/workflows/**'
      - 'src/**'
      - 'utest/**'
      - '!**/*.rst'
  workflow_dispatch:
    inputs:
      pythons:
        description: "Interpreters: 'quick' (the oldest and the newest) or 'all'"
        type: choice
        options: [ quick, all ]
        default: quick


jobs:
  test_using_builtin_python:

    strategy:
      fail-fast: false
      matrix:
        os: [ 'ubuntu-latest', 'windows-latest' ]
        # A push runs the oldest and the newest interpreters (the fork is not the
        # upstream project: the whole support matrix on every push is what got
        # Actions disabled on this fork). 'Run workflow' with pythons=all runs
        # all of them.
        python-version: ${{ fromJSON(inputs.pythons == 'all' && '["3.9", "3.10", "3.11", "3.12", "3.13"]' || '["3.9", "3.13"]') }}

    runs-on: ${{ matrix.os }}

    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          architecture: 'x64'

      - name: Run unit tests
        run: |
          python -m pip install -r utest/requirements.txt
          python utest/run.py -v
